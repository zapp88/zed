[package]
name = "miniprof_graph"
version = "0.1.0"
edition = "2021"
description = "CLI tool to parse zed.miniprof and emit folded stacks suitable for flamegraphs"
license = "MIT OR Apache-2.0"
publish = false

# Binary produced: `miniprof-fold`
[[bin]]
name = "miniprof-fold"
path = "src/main.rs"

[dependencies]
clap = { version = "4.2", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
regex = "1.9"
inferno = "0.12"

[profile.release]
opt-level = 3
